<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#fafaf7"/>
  <!-- constellation lines -->
  <line x1="6" y1="10" x2="16" y2="16" stroke="#0e0e10" stroke-width="0.9" opacity="0.45" stroke-dasharray="1.5 2.5"/>
  <line x1="16" y1="16" x2="26" y2="9" stroke="#0e0e10" stroke-width="0.9" opacity="0.45" stroke-dasharray="1.5 2.5"/>
  <line x1="16" y1="16" x2="24" y2="24" stroke="#0e0e10" stroke-width="0.9" opacity="0.45" stroke-dasharray="1.5 2.5"/>
  <!-- series line (red) -->
  <line x1="6" y1="10" x2="26" y2="9" stroke="#ff4423" stroke-width="1.0" opacity="0.6"/>
  <!-- background stars -->
  <circle cx="6" cy="10" r="1.8" fill="#0e0e10"/>
  <circle cx="26" cy="9" r="1.6" fill="#0e0e10"/>
  <circle cx="24" cy="24" r="1.5" fill="#0e0e10"/>
  <!-- hero star -->
  <circle cx="16" cy="16" r="4.5" fill="#0e0e10"/>
  <circle cx="16" cy="16" r="1.8" fill="#fff"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#ff4423" stroke-width="0.6" opacity="0.45"/>
  <line x1="11" y1="16" x2="21" y2="16" stroke="#0e0e10" stroke-width="0.6" opacity="0.3"/>
  <line x1="16" y1="11" x2="16" y2="21" stroke="#0e0e10" stroke-width="0.6" opacity="0.3"/>
</svg>
